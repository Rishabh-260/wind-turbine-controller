[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wind-turbine-controller-validation"
version = "1.0.0"
description = "Simulation-based validation and automated reporting for a simplified wind turbine pitch controller"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.8,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
