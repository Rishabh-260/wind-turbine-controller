name: Controller validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y texlive-latex-base texlive-latex-recommended

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3

      - name: Run MATLAB scenarios
        uses: matlab-actions/run-command@v3
        with:
          command: run('matlab/run_scenarios.m')

      - name: Run Python validation tests
        if: always()
        env:
          WIND_VALIDATION_REQUIRE_SIMULATION: "1"
        run: |
          mkdir -p artifacts
          pytest --junitxml=artifacts/test-results.xml

      - name: Generate plots and report
        if: always() && hashFiles('artifacts/raw/*.csv') != ''
        run: python -m wind_validation.report

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controller-validation-report
          path: artifacts/
          if-no-files-found: warn
